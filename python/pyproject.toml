[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leanhypothesis"
version = "0.1.0"
description = "Python bindings for Lean property-based testing using Hypothesis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LeanHypothesis Project"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "black",
    "mypy",
]

[project.scripts]
leanhypothesis = "leanhypothesis.bridge:main"

[tool.uv]
dev-dependencies = [
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
